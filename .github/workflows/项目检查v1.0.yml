name: 检查创作流程
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 安装本地合成工具
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: 离线合同与真实媒体合成测试
        run: node --test 验证/流程验证v1.0.mjs
      - name: 文档与文件命名检查
        run: node 验证/交付检查v1.0.mjs
